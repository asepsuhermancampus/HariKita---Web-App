<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Wax Drop Shadow & 3D Lighting Gradients -->
    <radialGradient id="waxBaseGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#A88B68" />
      <stop offset="45%" stop-color="#88735B" />
      <stop offset="85%" stop-color="#675440" />
      <stop offset="100%" stop-color="#4E3D2C" />
    </radialGradient>
    <radialGradient id="waxInnerGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#B99D79" />
      <stop offset="50%" stop-color="#88735B" />
      <stop offset="90%" stop-color="#5B4835" />
      <stop offset="100%" stop-color="#463625" />
    </radialGradient>
    <linearGradient id="embossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#675440" stop-opacity="0.2" />
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3B2A1E" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Organic Melted Wax Edge with 3D Depth -->
  <path
    d="M50 4 C64 3.5 77 9 86 19 C94 28 97 41 95 53 C93 66 85 78 74 87 C63 95 49 97 36 94 C23 91 12 82 7 70 C2 58 3 43 9 31 C15 19 26 9 39 5 C43 4.2 46 4.1 50 4 Z"
    fill="url(#waxBaseGrad)"
    stroke="#523E2B"
    stroke-width="1.2"
    filter="url(#waxShadow)"
  />

  <!-- Subtle Melted Rim Highlight -->
  <path
    d="M32 9 C43 6 58 6 72 13 C82 19 90 29 91 42 C92 53 87 64 78 72"
    stroke="#CDB79A"
    stroke-width="1"
    stroke-linecap="round"
    fill="none"
    opacity="0.45"
  />

  <!-- Pressed Recessed Center Circle -->
  <circle cx="50" cy="50" r="33" fill="url(#waxInnerGrad)" stroke="#4A3725" stroke-width="1.2" />

  <!-- Concentric Beaded / Dotted Ring -->
  <circle cx="50" cy="50" r="30" stroke="#FAF8F5" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.65" />
  <circle cx="50" cy="50" r="27" stroke="#FAF8F5" stroke-width="0.6" opacity="0.4" />

  <!-- HariKita HK Monogram (Refined Luxury Serif) -->
  <g fill="url(#embossHighlight)">
    <!-- Letter H -->
    <path d="M36 34 H39.5 V46.5 H46.5 V34 H50 V66 H46.5 V49.5 H39.5 V66 H36 Z" />
    <!-- Letter K (Interlocked Aesthetic) -->
    <path d="M52 34 H55.5 V47.8 L64 34 H68.5 L60.2 47.2 L69 66 H64.2 L55.5 50.8 V66 H52 Z" />
  </g>

  <!-- Fine Star Accents Top & Bottom -->
  <path d="M50 30.5 L50.8 32.2 L52.5 33 L50.8 33.8 L50 35.5 L49.2 33.8 L47.5 33 L49.2 32.2 Z" fill="#FAF8F5" opacity="0.6" />
  <path d="M50 64.5 L50.8 66.2 L52.5 67 L50.8 67.8 L50 69.5 L49.2 67.8 L47.5 67 L49.2 66.2 Z" fill="#FAF8F5" opacity="0.6" />
</svg>